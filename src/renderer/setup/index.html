<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="wrap">
        <div id="top"><span id="sub">One-time setup</span></div>

        <div id="screen-pick">
            <div id="models">
                <div class="model-row selected" data-model="base.en">
                    <div class="model-left">
                        <div class="model-name">Base</div>
                        <div class="model-desc">Fast, accurate, good default</div>
                    </div>
                    <span class="model-size">150 MB</span>
                </div>
                <div class="model-row" data-model="small.en">
                    <div class="model-left">
                        <div class="model-name">Small</div>
                        <div class="model-desc">Better accuracy, slightly slower</div>
                    </div>
                    <span class="model-size">466 MB</span>
                </div>
                <div class="model-row" data-model="tiny.en">
                    <div class="model-left">
                        <div class="model-name">Tiny</div>
                        <div class="model-desc">Very fast, lower accuracy</div>
                    </div>
                    <span class="model-size">75 MB</span>
                </div>
            </div>
            <div id="pick-footer">
                <button id="btn-download">Download</button>
            </div>
        </div>

        <div id="screen-progress" class="hidden">
            <div id="progress-inner">
                <div class="step">
                    <div class="step-label">
                        <span class="step-name">Whisper engine</span>
                        <span class="step-pct" id="pct-binary">0%</span>
                    </div>
                    <div class="bar">
                        <div class="fill" id="fill-binary"></div>
                    </div>
                    <div class="step-msg" id="msg-binary">Starting...</div>
                </div>
                <div class="step">
                    <div class="step-label">
                        <span class="step-name">Model</span>
                        <span class="step-pct" id="pct-model">0%</span>
                    </div>
                    <div class="bar">
                        <div class="fill" id="fill-model"></div>
                    </div>
                    <div class="step-msg" id="msg-model">Waiting...</div>
                </div>
                <div id="err" class="hidden"></div>
            </div>
            <div class="footer">
                <span class="footer-hint" id="progress-hint">This may take a few minutes...</span>
            </div>
        </div>

        <div id="screen-done" class="hidden">
            <div id="done-inner">
                <p id="done-title">VSPR is ready</p>
                <p id="done-sub">Hold <kbd>⌥ Space</kbd> to start dictating into any app</p>
            </div>
            <div class="footer">
                <button id="btn-start">Get Started</button>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>

</html>
