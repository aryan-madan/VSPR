<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="wrap">
        <div id="sidebar">
            <img id="logo" src="../logo.svg" draggable="false" />
            <nav>
                <button class="nav-btn active" data-tab="history">History</button>
                <button class="nav-btn" data-tab="settings">Settings</button>
            </nav>
        </div>

        <div id="content">
            <div id="tab-history" class="tab">
                <div id="history-list"></div>
                <div id="history-empty">No transcriptions yet</div>
                <div id="history-footer">
                    <button id="btn-clear">Clear history</button>
                </div>
            </div>

            <div id="tab-settings" class="tab hidden">
                <div class="setting-row">
                    <div class="setting-left">
                        <div class="setting-name">Model</div>
                        <div class="setting-desc">Transcription model in use</div>
                    </div>
                    <select id="sel-model">
                        <option value="tiny.en">Tiny</option>
                        <option value="base.en">Base</option>
                        <option value="small.en">Small</option>
                    </select>
                </div>
                <div class="setting-row">
                    <div class="setting-left">
                        <div class="setting-name">Hotkey</div>
                        <div class="setting-desc">Global shortcut to start dictating</div>
                    </div>
                    <input id="inp-hotkey" type="text" readonly placeholder="Click to set" />
                </div>
                <div class="setting-row">
                    <div class="setting-left">
                        <div class="setting-name">Version</div>
                        <div class="setting-desc">VSPR</div>
                    </div>
                    <span class="setting-val">0.2.0</span>
                </div>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>

</html>
