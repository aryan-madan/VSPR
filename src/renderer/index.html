<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #fff;
            color: #000;
            width: 220px;
            height: 160px;
            overflow: hidden;
            user-select: none;
        }

        #wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
        }

        #title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        #status {
            flex: 1;
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #666;
        }

        #dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #000;
            margin-right: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #dot.on {
            opacity: 1;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 0 0 10px;
        }

        #quit {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            text-align: left;
            padding: 0;
        }

        #quit.hover {
            color: #000;
        }
    </style>
</head>
<body>
  <div id="wrap">
    <div id="title">VSPR</div>
    <div id="status">
      <div id="dot"></div>
      <span id="label">Hold ⌥ Space to speak</span>
    </div>
    <hr />
    <button id="quit">Quit</button>
  </div>
  <script src="ui.js"></script>
</body>
</html>
